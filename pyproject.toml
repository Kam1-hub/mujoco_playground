[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "g1-training-env"
version = "1.0.0"
readme = "README.md"
authors = [
    {name = "Google DeepMind", email = "mujoco@deepmind.com"},
]
requires-python = ">=3.11"
description = "G1 Humanoid Robot Training Environment (extracted from MuJoCo Playground)"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Robot Framework :: Library",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "absl-py",
    "brax>=0.14.2",
    "etils",
    "flax",
    "jax",
    "lxml",
    "mediapy",
    "ml_collections",
    "mujoco-mjx>=3.6.0",
    "mujoco>=3.6.0",
    "warp-lang>=1.11",
    "orbax-checkpoint>=0.11.22",
    "tqdm",
]
keywords = ["mjx", "mujoco", "g1", "humanoid", "reinforcement learning"]

[project.optional-dependencies]
cuda = [
    "jax[cuda12]",
]
test = [
    "absl-py",
    "pytest",
    "pytest-xdist",
]
notebooks = [
    "matplotlib",
    "jupyter",
]
dev = [
    "g1-training-env[test]",
    "mypy",
    "pyink",
    "pytype",
    "ruff",
    "pre-commit",
    "pylint",
    "pytest-xdist",
]
learning = [
    "rsl-rl-lib>=3.0.0",
    "wandb",
]
all = [
    "g1-training-env[dev]",
    "g1-training-env[cuda]",
    "g1-training-env[notebooks]",
    "g1-training-env[learning]",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["g1_env", "learning"]

[project.scripts]
train-g1-jax = "learning.train_jax_ppo:run"
train-g1-rsl = "learning.train_rsl_rl:run"
train-g1-sac-brax = "learning.train_jax_sac_brax:run"
train-g1-sac = "learning.train_jax_sac_lift:run"

[tool.ruff]
lint.select = [
    "E",  # pycodestyle errors.
    "F",  # Pyflakes rules.
    "PLC",  # Pylint convention warnings.
    "PLE",  # Pylint errors.
    "PLR",  # Pylint refactor recommendations.
    "PLW",  # Pylint warnings.
    "I"  # Import sorting.
]
lint.ignore = [
    "E741", # Ambiguous variable name. (l, O, or I)
    "E501",  # Line too long.
    "PLR2004",  # Magic value used in comparison.
    "PLR0915",  # Too many statements.
    "PLR0913",  # Too many arguments.
    "PLC0414",  # Import alias does not rename variable. (this is used for exporting names)
    "PLC1901",  # Use falsey strings.
    "PLR5501",  # Use `elif` instead of `else if`.
    "PLR0911",  # Too many return statements.
    "PLR0912",  # Too many branches.
    "PLW0603",  # Global statement updates are discouraged.
    "PLW2901"  # For loop variable overwritten.
]
exclude = [
    "mujoco_menagerie/",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["scripts/", "mujoco_menagerie/"]

[tool.pytest.ini_options]
testpaths = [
    "g1_env/_src/",
]

[tool.isort]
force_single_line = true
force_sort_within_sections = true
lexicographical = true
single_line_exclusions = ["typing"]
order_by_type = false
group_by_package = true
line_length = 120
use_parentheses = true
multi_line_output = 3
include_trailing_comma = true
skip = ["mujoco_menagerie", ".pytype"]
skip_glob = ["**/*.ipynb"]

[tool.pyink]
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true
extend-exclude = '''(
 mujoco_menagerie
 | .ipynb$
)'''

[pytype]
inputs = "."
exclude = [
    "**/*_test.py",
    "**/test_*.py",
    "mujoco_menagerie/**",
    "g1_env/_src/wrapper_torch.py",
]
output = ".pytype"
report_errors = true

[tool.hatch.build]
include = [
    "g1_env/__init__.py",
    "g1_env/_src/**/*",
    "g1_env/config/**/*",
    "learning/**/*",
]
